name: Smoke

# v1.2.13: lightweight CI so a syntax error / broken import / silently-
# moved-helper never reaches a beta tag again. We don't run the full
# Inno installer build here (Windows runner + Inno-on-the-fly + signing
# story) — that stays on the maintainer's machine for now. What we do
# do is parse + import bridge.py on a clean runner and run a brief
# headless boot to confirm the asyncio loop + HTTP + WS endpoints
# wire up without exceptions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-boot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime deps
        # Bridge imports psutil + pystray + PIL + winrt. winrt is
        # optional (the bridge handles its absence) but installing it
        # exercises the real import path.
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil pystray Pillow winrt-Windows.Foundation winrt-Windows.Media.Control

      - name: Syntax check + import
        # `python -m py_compile` rejects syntax errors. Importing the
        # file then exercises module-level definitions (DEFAULT_SCREEN_
        # SETTINGS, TRANSLATIONS, the regex compiles, …).
        shell: pwsh
        run: |
          python -m py_compile wallpaper_bridge/bridge.py
          python -c "import sys; sys.path.insert(0, 'wallpaper_bridge'); import bridge; print('APP_VERSION =', bridge.APP_VERSION)"

      - name: Spot-check module-level invariants
        # Cheap structural assertions on the imported bridge module —
        # mostly here so a future refactor that renames / drops a
        # critical helper hits CI instead of a beta tag. Add more as
        # bug-classes show up.
        shell: pwsh
        run: |
          python -c @"
          import sys; sys.path.insert(0, 'wallpaper_bridge')
          import bridge as b
          assert isinstance(b.DEFAULT_SCREEN_SETTINGS, dict), 'DEFAULT_SCREEN_SETTINGS missing'
          assert 'frameRate' in b.DEFAULT_SCREEN_SETTINGS, 'frameRate setting missing'
          assert 'gridRenderer' in b.DEFAULT_SCREEN_SETTINGS, 'gridRenderer setting missing'
          assert 'glassQuality' in b.DEFAULT_SCREEN_SETTINGS, 'glassQuality setting missing'
          assert callable(b.parse_http_headers), 'parse_http_headers missing'
          assert callable(b._acao), '_acao helper missing'
          assert b.WS_HOST == '127.0.0.1', 'WS_HOST drifted from loopback'
          # The tray imports are optional so the module can load on Linux,
          # but on Windows they must always succeed. Without this, a typo
          # or a missing dependency would silently downgrade the shipped
          # build to headless — no tray icon, no settings dialog — and the
          # try/except would swallow the reason.
          assert b._HAS_TRAY is True, f'tray stack failed to import: {b._TRAY_IMPORT_ERROR}'
          assert b.tk is not None and b.pystray is not None, 'tray modules are None on Windows'
          print('OK')
          "@

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regression suite
        # tests/ — behavioural cover for the WS client lifecycle and the
        # wallpaper page's standby-card state machine. Hermetic: no
        # bridge process, no ports, no SignalRGB instance. See
        # tests/README.md for why each suite exists.
        run: python tests/run_all.py

      - name: Byte-compile every python source
        # Catches syntax errors in modules the suite never imports.
        run: python -m compileall -q wallpaper_bridge

  linux-import:
    # The bridge had never once been imported on Linux. SignalRGB is
    # building a Linux version and the plan is to run there against
    # OpenRGB before it lands, so "does the module even load" is worth
    # knowing on every push rather than on the day someone tries it.
    #
    # This is deliberately narrower than the Windows job: import, byte-
    # compile, and the hermetic suites. No headless boot — the tray and
    # its tkinter dialog are still unconditional, so a real Linux launch
    # needs the --headless work from the porting plan first. Keeping the
    # job honest about that is the point; a green tick here means the
    # module loads, nothing more.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime deps
        # Deliberately NOT installing python3-tk or a pystray backend.
        # The GUI stack is optional by design, and the interesting
        # question on Linux is whether the bridge loads *without* it —
        # installing it here would test the one configuration the port
        # will not be running in.
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil Pillow

      - name: Import bridge.py on Linux
        # Four things used to make this impossible:
        #   from ctypes import wintypes  — raises ValueError off Windows
        #   _MONITORINFO._fields_        — dereferences wintypes at class
        #                                  definition time
        #   import tkinter as tk         — separate system package
        #   import pystray               — needs a GTK/X11 backend
        # All four are now guarded. If any regresses, this step catches
        # it. bridge.py replaces sys.stdout on import, so the result goes
        # to a file rather than the console.
        run: |
          python -c "
          import sys, traceback
          sys.path.insert(0, 'wallpaper_bridge')
          out = []
          try:
              import bridge
              assert bridge.wintypes is None, 'wintypes should be None off Windows'
              assert bridge._user32 is None, '_user32 should be None off Windows'
              assert bridge._MONITORINFO is None, '_MONITORINFO should be None off Windows'
              assert bridge._is_fullscreen_active() is False, 'fullscreen probe must no-op'
              assert bridge._HAS_TRAY is False, 'no GUI stack installed, so _HAS_TRAY must be False'
              assert callable(bridge.Broadcaster), 'Broadcaster missing'
              assert callable(bridge.UdpReceiver), 'UdpReceiver missing'
              out.append('imported OK on Linux - ' + bridge.APP_VERSION)
          except Exception:
              out.append(traceback.format_exc())
              open('result.txt','w').write(chr(10).join(out)); raise SystemExit(1)
          open('result.txt','w').write(chr(10).join(out))
          " || (cat result.txt; exit 1)
          cat result.txt

      - name: Byte-compile every python source
        run: python -m compileall -q wallpaper_bridge

      - name: Set up Node
        # run_all.py skips the JS suites when node is missing rather than
        # failing, so without this the job would go green while quietly
        # running less than half the tests.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regression suite
        # All ten suites run here, pwsh ones included: ubuntu-latest ships
        # PowerShell 7, so run_all.py's "skip when absent" path never
        # triggers. That is the better outcome — it caught test_reimport_
        # workshop.ps1 reaching for $env:TEMP, which is null off Windows —
        # but it does mean a Windows-only assumption in a test fails this
        # job rather than being quietly skipped.
        run: python tests/run_all.py

  version-consistency:
    # A release cut must not ship an APP_VERSION the Configurator's
    # "What's new" modal can't render, or one the changelog doesn't
    # mention. Both drifted during the v2.4.x line.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: APP_VERSION has release notes + a changelog entry
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -oP '^APP_VERSION\s*=\s*"\K[^"]+' wallpaper_bridge/bridge.py)
          wp=$(grep -oP '^WALLPAPER_VERSION\s*=\s*"\K[^"]+' wallpaper_bridge/bridge.py)
          echo "APP_VERSION=$ver  WALLPAPER_VERSION=$wp"

          if ! grep -q "\"$ver\": {" wallpaper_bridge/bridge.py; then
            echo "::error file=wallpaper_bridge/bridge.py::No RELEASE_NOTES entry for $ver"
            exit 1
          fi
          if ! grep -q "^## \[$ver\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No heading for $ver"
            exit 1
          fi

          # pyproject.toml carries the version statically — reading it
          # from bridge.py would mean importing pystray/Pillow/tkinter
          # just to resolve a string. Static is the right call, but only
          # if something checks it, so that something is here.
          pv=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml)
          if [ "$pv" != "$ver" ]; then
            echo "::error file=pyproject.toml::version is $pv, APP_VERSION is $ver"
            exit 1
          fi
          echo "OK — release notes, changelog and pyproject all agree on $ver"

      - name: pyproject declares what the code imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, re, sys, tomllib, pathlib

          data = tomllib.load(open("pyproject.toml", "rb"))
          declared = set()
          for spec in data["project"]["dependencies"]:
              declared.add(re.split(r"[<>=!\[; ]", spec)[0].lower())
          for extra in data["project"].get("optional-dependencies", {}).values():
              for spec in extra:
                  declared.add(re.split(r"[<>=!\[; ]", spec)[0].lower())

          # import name -> distribution name, for the cases where they differ
          alias = {"pil": "pillow", "winrt": "winrt-runtime"}
          stdlib = set(sys.stdlib_module_names)
          local = {p.stem for p in pathlib.Path("wallpaper_bridge").glob("*.py")}

          # Parse rather than grep. A regex over the raw text also matches
          # English prose inside docstrings — "import the Lively/WE bundle",
          # "from any sACN sender" — and reports modules named `the` and
          # `any` as undeclared dependencies. ast sees only real imports.
          missing = {}
          for path in pathlib.Path("wallpaper_bridge").glob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8", errors="replace"), str(path))
              tops = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      tops.update(a.name.split(".")[0] for a in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      if node.level == 0 and node.module:
                          tops.add(node.module.split(".")[0])
              for top in tops:
                  if top in stdlib or top in local:
                      continue
                  name = alias.get(top.lower(), top.lower())
                  if name not in declared:
                      missing.setdefault(name, path.name)

          if missing:
              for name, where in sorted(missing.items()):
                  print(f"::error file=pyproject.toml::{name} imported in {where} but not declared")
              raise SystemExit(1)
          print("OK — every third-party import is declared:", ", ".join(sorted(declared)))
          PY
